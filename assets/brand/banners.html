*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:400 16px/1.7 Manrope,sans-serif}main{max-width:1600px;margin:auto;padding:64px 32px}header{margin-bottom:64px}h1,h2{font-family:"Days One",sans-serif;font-weight:400;line-height:1.2;letter-spacing:-.035em}h1{font-size:clamp(32px,3.5vw,50px);margin:0 0 24px}h2{font-size:28px;margin:0 0 24px}p{max-width:65ch;color:var(--muted);margin:0}section+section{margin-top:48px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;border-radius:24px}figcaption{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}nav{display:flex;gap:8px}a{display:inline-flex;align-items:center;justify-content:center;min-width:56px;min-height:44px;padding:8px 16px;border-radius:999px;background:var(--secondary);color:var(--text);text-decoration:none}a:hover{background:var(--primary);color:white}a:focus-visible{outline:2px solid var(--primary);outline-offset:3px}footer{margin-top:64px;font-size:14px;color:var(--muted)}footer a{margin:8px 8px 0 0}@media(max-width:800px){main{padding:32px 16px}.pair{grid-template-columns:1fr}header{margin-bottom:40px}h2{font-size:24px}}@media(forced-colors:active){a:focus-visible{outline-color:Highlight}}

ма"><a href="telegram/description-light.png" download>PNG</a><a href="telegram/description-light.svg" download>SVG</a></nav></figcaption></figure><figure><img src="telegram/description-dark.svg" width="640" height="360" alt="Want Allure: Telegram, тёмная тема"><figcaption><span>Тёмная тема, 640×360</span><nav aria-label="Telegram: тёмная тема"><a href="telegram/description-dark.png" download>PNG</a><a href="telegram/description-dark.svg" download>SVG</a></nav></figcaption></figure></div></section><footer>Days One и Manrope встроены в страницу. Лицензии шрифтов: <a href="font-licenses/daysone-OFL.txt">Days One</a><a href="font-licenses/manrope-OFL.txt">Manrope</a></footer></main></body></html>
