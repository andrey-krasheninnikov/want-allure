worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    types { font/ttf ttf; font/otf otf; application/manifest+json webmanifest; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map "$status:$request_uri" $cache_control {
        default "public, max-age=0, must-revalidate";
        ~^[45][0-9][0-9]: "no-store";
        ~^[0-9]+:/_astro/ "public, max-age=31536000, immutable";
        ~\.html(\?|$) "no-store";
        ~/(\?|$) "no-store";
        ~^[0-9]+:/release\.json(\?|$) "no-store";
        ~^[0-9]+:/_flutter/(flutter_bootstrap|flutter_service_worker)\.js(\?|$) "no-store";
    }
    server {
        listen 8080;
        server_name _;
        root /srv/current;
        index index.html;
        absolute_redirect off;
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        error_page 404 /404.html;
        location = /404.html { internal; }
        location ~ /\. { return 404; }
        location /_astro/ {
            root /srv;
            try_files /current$uri /previous$uri =404;
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
