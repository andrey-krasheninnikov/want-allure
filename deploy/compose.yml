name: want-allure
services:
  static:
    image: nginxinc/nginx-unprivileged@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
    container_name: want-allure-static
    command: [nginx, -g, 'daemon off;']
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 32
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data:/srv:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      edge:
        aliases: [allure]
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/release.json']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '3'
networks:
  edge:
    external: true
    name: want-edge
