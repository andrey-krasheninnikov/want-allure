name: want_allure
description: Want Allure design system for Flutter. ForUI-based components, themes, typography, motion and accessible product compositions.
version: 1.2.2
homepage: https://github.com/andrey-krasheninnikov/want-allure
repository: https://github.com/andrey-krasheninnikov/want-allure/tree/main/packages/flutter
issue_tracker: https://github.com/andrey-krasheninnikov/want-allure/issues
topics:
  - design-system
  - widgets
  - user-interface
  - forui
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:
environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  forui: ^0.27.7
  material_ui: ^1.9.0
  file_selector: ^1.1.0
  super_drag_and_drop: ^0.9.1
  flutter_svg: ^2.3.2
  cross_file: ^0.3.5
  cupertino_icons: ^1.0.8
  mime: ^2.0.0
  toastification: ^3.2.2
  smooth_sheets: ^1.3.0
  phosphoricons_flutter: ^1.1.1
  find_in_page: ^2.4.0
  visibility_detector: ^0.4.0+2
  sprung: ^3.0.1
  ditredi: ^2.0.2
  dart_earcut: ^1.2.0
  path_parsing: ^1.1.0
  xml: ^7.0.1
  vector_math: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_selector_platform_interface: ^2.7.0
flutter:
  shaders:
    - shaders/lightning.frag
    - shaders/shimmer.frag
    - shaders/sphere.frag
  assets:
    - assets/brand/
    - assets/brand/allure/logos/light/
    - assets/brand/allure/logos/dark/
    - assets/brand/allure/backgrounds/
  fonts:
    - family: Days One
      fonts:
        - asset: assets/fonts/DaysOne-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: Noto Sans Hebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew.ttf
